<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yousef - Contact Card</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      color: #333;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
    .title { color: #666; font-size: 0.95rem; }
    .org { color: #888; font-size: 0.85rem; margin-bottom: 1.25rem; }
    .info {
      text-align: left;
      margin: 1.25rem 0;
      border-top: 1px solid #eee;
      padding-top: 1rem;
    }
    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.5rem 0;
    }
    .info-row + .info-row { border-top: 1px solid #f0f0f0; }
    .info-label {
      color: #999;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      min-width: 60px;
      padding-top: 2px;
    }
    .info-value {
      font-size: 0.95rem;
      color: #333;
      word-break: break-word;
    }
    .info-value a {
      color: #007AFF;
      text-decoration: none;
    }
    .info-value a:hover { text-decoration: underline; }
    .note {
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      background: #f9f9f9;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #555;
      text-align: center;
      line-height: 1.5;
      white-space: pre-line;
    }
    button.download {
      display: inline-block;
      background: #007AFF;
      color: white;
      border: none;
      cursor: pointer;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      transition: background 0.2s;
      margin-top: 1.25rem;
    }
    button.download:hover { background: #0056CC; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Youssef Elmrabit</h1>
    <div class="title">Conseiller Commercial</div>
    <div class="org">Electroplanet</div>

    <div class="info">
      <div class="info-row">
        <span class="info-label">Phone</span>
        <span class="info-value"><a href="tel:+212628280337">+212 628-280337</a></span>
      </div>
      <div class="info-row">
        <span class="info-label">Email</span>
        <span class="info-value"><a href="mailto:youssefelmrabit8@gmail.com">youssefelmrabit8@gmail.com</a></span>
      </div>
      <div class="info-row">
        <span class="info-label">Address</span>
        <span class="info-value">Electroplanet Laayoune - Maroc</span>
      </div>
    </div>

    <div class="note">Bienvenue à tous
مرحبا بالجميع</div>

    <button class="download" onclick="downloadVCF()">Save Contact</button>
  </div>

  <script>
    function downloadVCF() {
      fetch('yousef.vcf')
        .then(function(r) { return r.blob(); })
        .then(function(blob) {
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'yousef.vcf';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        });
    }
  </script>
</body>
</html>
