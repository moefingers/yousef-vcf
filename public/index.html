<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yousef - Contact Card</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      color: #333;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 360px;
      width: 90%;
    }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    p { color: #666; margin-bottom: 1.5rem; }
    a.download {
      display: inline-block;
      background: #007AFF;
      color: white;
      text-decoration: none;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      font-weight: 500;
      transition: background 0.2s;
    }
    a.download:hover { background: #0056CC; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Youssef Elmrabit</h1>
    <p>Tap below to save my contact info.</p>
    <a class="download" href="vcard/Youssef_Elmrabit.vcf">Save Contact</a>
  </div>
</body>
</html>
