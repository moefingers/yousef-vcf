<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Youssef Elmrabit - Contact</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2a0408 0%, #111 40%, #111 60%, #2a0408 100%);
      color: #eee;
      padding: 1rem;
    }

    /* Card flip container */
    .card-container {
      perspective: 1200px;
      max-width: 400px;
      width: 100%;
    }
    .card-inner {
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s ease;
    }
    .card-container.flipped .card-inner {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      backface-visibility: hidden;
      background: linear-gradient(145deg, rgba(225,11,28,0.08) 0%, rgba(26,26,26,0.7) 40%, rgba(26,26,26,0.7) 70%, rgba(225,11,28,0.05) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid rgba(225,11,28,0.15);
    }
    .card-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
    }

    /* Coin */
    .coin {
      width: 100px;
      height: 100px;
      margin: 0 auto 1rem;
      perspective: 600px;
    }
    .coin-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: coin-spin 4s ease-in-out infinite;
    }
    .coin-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 50%;
      overflow: hidden;
    }
    .coin-front-img {
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .coin-front-img img { width: 100%; height: 100%; }
    .coin-back-img { transform: rotateY(180deg); }
    .coin-back-img img { width: 100%; height: 100%; object-fit: cover; }
    @keyframes coin-spin {
      0%, 100% { transform: rotateY(0deg); }
      40%, 60% { transform: rotateY(180deg); }
    }

    /* Header */
    h1 { font-size: 1.8rem; margin-bottom: 0.25rem; color: #e10b1c; }
    .title { color: #ccc; font-size: 0.95rem; }
    .org { color: #999; font-size: 0.85rem; margin-bottom: 1.25rem; }

    /* Info rows */
    .info {
      text-align: left;
      margin: 1.25rem 0;
      border-top: 1px solid #333;
      padding-top: 0.5rem;
    }
    .info-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .info-row:hover { background: rgba(255,255,255,0.04); }
    .info-row + .info-row { border-top: 1px solid #2a2a2a; }
    .info-icon {
      color: #e10b1c;
      flex-shrink: 0;
      width: 18px;
      height: 18px;
    }
    .info-content { flex: 1; min-width: 0; }
    .info-label {
      color: #888;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      line-height: 1;
      margin-bottom: 2px;
    }
    .info-value {
      font-size: 0.95rem;
      color: #ddd;
      word-break: break-word;
    }
    .info-value a {
      color: #ddd;
      text-decoration: none;
    }
    .info-value a:hover { color: #e10b1c; }
    .copy-hint {
      color: #444;
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      transition: color 0.2s;
    }
    .info-row:hover .copy-hint { color: #888; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #e10b1c;
      color: white;
      padding: 0.5rem 1.25rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 10;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Note */
    .note {
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      background: rgba(34,34,34,0.8);
      border-radius: 8px;
      font-size: 0.9rem;
      color: #bbb;
      text-align: center;
      line-height: 1.5;
      white-space: pre-line;
    }

    /* Buttons */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 1.25rem;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border: none;
      cursor: pointer;
      padding: 0.7rem 1.25rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.2s, transform 0.1s;
      text-decoration: none;
      width: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: #e10b1c; color: white; }
    .btn-primary:hover { background: #b80917; }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: #ccc;
      border: 1px solid #333;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); }
    .btn-whatsapp { background: #25D366; color: white; }
    .btn-whatsapp:hover { background: #1da851; }
    .btn-row {
      display: flex;
      gap: 0.5rem;
    }
    .btn-row .btn { flex: 1; }
    .btn i, .btn [data-lucide] { width: 18px; height: 18px; }

    /* QR back side */
    .qr-back-title {
      font-size: 1rem;
      color: #999;
      font-weight: 500;
    }
    .qr-back-name {
      font-size: 1.4rem;
      color: #e10b1c;
      font-weight: 600;
    }
    #qrCanvas {
      border-radius: 12px;
      max-width: 220px;
      width: 100%;
      height: auto;
    }
    .qr-hint {
      font-size: 0.8rem;
      color: #666;
    }

    /* RTL */
    [dir="rtl"] .info { text-align: right; }
    [dir="rtl"] .info-row { flex-direction: row-reverse; }
    [dir="rtl"] .info-label { text-align: right; }
  </style>
</head>
<body>
  <div class="card-container" id="cardContainer">
    <div class="card-inner">

      <!-- FRONT -->
      <div class="card-front">
        <div class="coin">
          <div class="coin-inner">
            <div class="coin-face coin-front-img">
              <img src="electroplanet-logo.svg" alt="Electroplanet">
            </div>
            <div class="coin-face coin-back-img">
              <img src="youssef_gemini_suit_cropped.webp" alt="Youssef Elmrabit">
            </div>
          </div>
        </div>
        <h1>Youssef Elmrabit</h1>
        <div class="title" data-i18n="title"></div>
        <div class="org">Electroplanet</div>

        <div class="info">
          <div class="info-row" onclick="copyText('+212 628-280337')">
            <i data-lucide="phone" class="info-icon"></i>
            <div class="info-content">
              <div class="info-label" data-i18n="phone"></div>
              <div class="info-value"><a href="tel:+212628280337" onclick="event.stopPropagation()">+212 628-280337</a></div>
            </div>
            <i data-lucide="copy" class="copy-hint"></i>
          </div>
          <div class="info-row" onclick="copyText('youssefelmrabit8@gmail.com')">
            <i data-lucide="mail" class="info-icon"></i>
            <div class="info-content">
              <div class="info-label" data-i18n="email"></div>
              <div class="info-value"><a href="mailto:youssefelmrabit8@gmail.com" onclick="event.stopPropagation()">youssefelmrabit8@gmail.com</a></div>
            </div>
            <i data-lucide="copy" class="copy-hint"></i>
          </div>
          <div class="info-row" onclick="openMap()">
            <i data-lucide="map-pin" class="info-icon"></i>
            <div class="info-content">
              <div class="info-label" data-i18n="address"></div>
              <div class="info-value" data-i18n="addressValue"></div>
            </div>
            <i data-lucide="external-link" class="copy-hint"></i>
          </div>
        </div>

        <div class="note" data-i18n="note"></div>

        <div class="actions">
          <button class="btn btn-primary" id="saveBtn" onclick="downloadVCF()">
            <i data-lucide="user-plus"></i>
            <span data-i18n="save"></span>
          </button>
          <div class="btn-row">
            <a class="btn btn-whatsapp" href="https://wa.me/212628280337" target="_blank" rel="noopener">
              <i data-lucide="message-circle"></i>
              <span>WhatsApp</span>
            </a>
            <button class="btn btn-secondary" id="shareBtn" onclick="shareContact()" style="display:none">
              <i data-lucide="share-2"></i>
              <span data-i18n="share"></span>
            </button>
          </div>
          <button class="btn btn-secondary" onclick="flipCard()">
            <i data-lucide="qr-code"></i>
            <span data-i18n="showQR"></span>
          </button>
        </div>
      </div>

      <!-- BACK (QR) -->
      <div class="card-back">
        <div class="qr-back-title" data-i18n="scanToSave"></div>
        <div class="qr-back-name">Youssef Elmrabit</div>
        <canvas id="qrCanvas"></canvas>
        <div class="qr-hint">Electroplanet - Laayoune</div>
        <button class="btn btn-secondary" onclick="flipCard()" style="max-width: 200px;">
          <i data-lucide="arrow-left"></i>
          <span data-i18n="backToCard"></span>
        </button>
      </div>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var i18n = {
      en: {
        title: 'Sales Advisor',
        phone: 'Phone',
        email: 'Email',
        address: 'Address',
        addressValue: 'Electroplanet Laayoune - Morocco',
        note: 'Welcome, Everyone!',
        save: 'Save Contact',
        share: 'Share',
        showQR: 'Show QR Code',
        backToCard: 'Back',
        scanToSave: 'Scan to save contact',
        copied: 'Copied!',
        saved: 'Contact Saved!'
      },
      fr: {
        title: 'Conseiller Commercial',
        phone: 'Tél',
        email: 'Email',
        address: 'Adresse',
        addressValue: 'Electroplanet Laayoune - Maroc',
        note: 'Bienvenue à tous',
        save: 'Enregistrer le contact',
        share: 'Partager',
        showQR: 'Afficher le QR',
        backToCard: 'Retour',
        scanToSave: 'Scannez pour enregistrer',
        copied: 'Copié !',
        saved: 'Contact enregistré !'
      },
      ar: {
        title: 'مستشار تجاري',
        phone: 'الهاتف',
        email: 'البريد',
        address: 'العنوان',
        addressValue: 'إلكتروبلانيت العيون - المغرب',
        note: 'مرحبا بالجميع',
        save: 'حفظ جهة الاتصال',
        share: 'مشاركة',
        showQR: 'عرض رمز QR',
        backToCard: 'رجوع',
        scanToSave: 'امسح لحفظ جهة الاتصال',
        copied: 'تم النسخ!',
        saved: 'تم حفظ جهة الاتصال!'
      }
    };

    var currentLang = 'en';

    function getStrings() { return i18n[currentLang] || i18n.en; }

    function applyLang(lang) {
      currentLang = lang.slice(0, 2).toLowerCase();
      if (!i18n[currentLang]) currentLang = 'en';
      var strings = getStrings();
      var dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      document.documentElement.lang = currentLang;
      document.documentElement.dir = dir;
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        el.textContent = strings[el.getAttribute('data-i18n')];
      });
    }

    applyLang(navigator.language || 'en');

    // Init Lucide icons
    lucide.createIcons();

    // Show share button if Web Share API available
    if (navigator.share) {
      document.getElementById('shareBtn').style.display = '';
    }

    // Toast
    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 2000);
    }

    // Copy to clipboard
    function copyText(text) {
      navigator.clipboard.writeText(text).then(function() {
        showToast(getStrings().copied);
      });
    }

    // Open address in maps
    function openMap() {
      window.open('https://maps.app.goo.gl/VchQxnutu3NDjPL47', '_blank');
    }

    // Flip card to show/hide QR
    var qrDrawn = false;
    function flipCard() {
      var container = document.getElementById('cardContainer');
      container.classList.toggle('flipped');
      if (!qrDrawn) {
        qrDrawn = true;
        drawQR(document.getElementById('qrCanvas'), window.location.href);
      }
    }

    // Save contact
    function downloadVCF() {
      var file = 'yousef-' + currentLang + '.vcf';
      var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobile) {
        window.location.href = file;
      } else {
        fetch(file)
          .then(function(r) { return r.blob(); })
          .then(function(blob) {
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'yousef.vcf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          });
      }
      showToast(getStrings().saved);
    }

    // Share via Web Share API
    function shareContact() {
      var file = 'yousef-' + currentLang + '.vcf';
      fetch(file)
        .then(function(r) { return r.blob(); })
        .then(function(blob) {
          var vcfFile = new File([blob], 'yousef.vcf', { type: 'text/vcard' });
          navigator.share({
            title: 'Youssef Elmrabit',
            text: getStrings().title + ' - Electroplanet',
            files: [vcfFile]
          }).catch(function() {
            navigator.share({
              title: 'Youssef Elmrabit',
              text: getStrings().title + ' - Electroplanet\n+212 628-280337\nyoussefelmrabit8@gmail.com',
              url: window.location.href
            }).catch(function() {});
          });
        });
    }

    // QR Code renderer
    function drawQR(canvas, text) {
      var modules = generateQR(text);
      var cellSize = 8;
      var quietZone = 2;
      var totalModules = modules.length + quietZone * 2;
      var size = totalModules * cellSize;
      canvas.width = size;
      canvas.height = size;
      var ctx = canvas.getContext('2d');

      // White background with rounded corners
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, size, size);

      // Draw modules
      ctx.fillStyle = '#111';
      for (var r = 0; r < modules.length; r++) {
        for (var c = 0; c < modules[r].length; c++) {
          if (modules[r][c]) {
            var x = (c + quietZone) * cellSize;
            var y = (r + quietZone) * cellSize;
            ctx.beginPath();
            ctx.roundRect(x, y, cellSize, cellSize, 1);
            ctx.fill();
          }
        }
      }
    }

    // Minimal QR Code generator (Mode Byte, ECC L, Version 1-6)
    function generateQR(text) {
      var data = [];
      for (var i = 0; i < text.length; i++) data.push(text.charCodeAt(i));

      var caps = [0, 17, 32, 53, 78, 106, 134];
      var ver = 1;
      for (var v = 1; v <= 6; v++) { if (caps[v] >= data.length) { ver = v; break; } }
      var size = ver * 4 + 17;

      var eccTable = {
        1: { total: 26, ecc: 7 },
        2: { total: 44, ecc: 10 },
        3: { total: 70, ecc: 15 },
        4: { total: 100, ecc: 20 },
        5: { total: 134, ecc: 26 },
        6: { total: 172, ecc: 18 }
      };

      var totalBytes = eccTable[ver].total;
      var eccBytes = eccTable[ver].ecc;
      var dataBytes = totalBytes - eccBytes;

      var bits = [];
      function pushBits(val, len) { for (var i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); }

      pushBits(4, 4);
      pushBits(data.length, ver <= 9 ? 8 : 16);
      for (var i = 0; i < data.length; i++) pushBits(data[i], 8);
      pushBits(0, Math.min(4, dataBytes * 8 - bits.length));
      while (bits.length % 8 !== 0) bits.push(0);
      while (bits.length < dataBytes * 8) {
        pushBits(0xEC, 8);
        if (bits.length < dataBytes * 8) pushBits(0x11, 8);
      }

      var codewords = [];
      for (var i = 0; i < bits.length; i += 8) {
        var b = 0;
        for (var j = 0; j < 8; j++) b = (b << 1) | (bits[i + j] || 0);
        codewords.push(b);
      }

      var ecc = rsEncode(codewords, eccBytes);
      var allCodewords = codewords.concat(ecc);

      var grid = [], reserved = [];
      for (var r = 0; r < size; r++) {
        grid[r] = []; reserved[r] = [];
        for (var c = 0; c < size; c++) { grid[r][c] = false; reserved[r][c] = false; }
      }

      function placeFinder(row, col) {
        for (var r = -1; r <= 7; r++) {
          for (var c = -1; c <= 7; c++) {
            var rr = row + r, cc = col + c;
            if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
            grid[rr][cc] = (r === 0 || r === 6 || c === 0 || c === 6) || (r >= 2 && r <= 4 && c >= 2 && c <= 4);
            reserved[rr][cc] = true;
          }
        }
      }
      placeFinder(0, 0); placeFinder(0, size - 7); placeFinder(size - 7, 0);

      for (var i = 8; i < size - 8; i++) {
        grid[6][i] = i % 2 === 0; reserved[6][i] = true;
        grid[i][6] = i % 2 === 0; reserved[i][6] = true;
      }

      grid[size - 8][8] = true; reserved[size - 8][8] = true;

      for (var i = 0; i < 9; i++) { reserved[8][i] = true; reserved[i][8] = true; }
      for (var i = 0; i < 8; i++) { reserved[8][size - 1 - i] = true; reserved[size - 1 - i][8] = true; }

      if (ver >= 2) {
        var alignPos = [6, size - 7];
        for (var ai = 0; ai < alignPos.length; ai++) {
          for (var aj = 0; aj < alignPos.length; aj++) {
            var ar = alignPos[ai], ac = alignPos[aj];
            if (reserved[ar][ac]) continue;
            for (var r = -2; r <= 2; r++) {
              for (var c = -2; c <= 2; c++) {
                grid[ar + r][ac + c] = Math.abs(r) === 2 || Math.abs(c) === 2 || (r === 0 && c === 0);
                reserved[ar + r][ac + c] = true;
              }
            }
          }
        }
      }

      var allBits = [];
      for (var i = 0; i < allCodewords.length; i++)
        for (var j = 7; j >= 0; j--) allBits.push((allCodewords[i] >> j) & 1);

      var bitIdx = 0, col = size - 1, upward = true;
      while (col > 0) {
        if (col === 6) col--;
        for (var cnt = 0; cnt < size; cnt++) {
          var row = upward ? size - 1 - cnt : cnt;
          for (var d = 0; d < 2; d++) {
            var c = col - d;
            if (reserved[row][c]) continue;
            grid[row][c] = bitIdx < allBits.length ? !!allBits[bitIdx] : false;
            bitIdx++;
          }
        }
        upward = !upward; col -= 2;
      }

      for (var r = 0; r < size; r++)
        for (var c = 0; c < size; c++)
          if (!reserved[r][c] && (r + c) % 2 === 0) grid[r][c] = !grid[r][c];

      var formatBits = 0x5412;
      var fp1 = [[0,8],[1,8],[2,8],[3,8],[4,8],[5,8],[7,8],[8,8],[8,7],[8,5],[8,4],[8,3],[8,2],[8,1],[8,0]];
      var fp2 = [[8,size-1],[8,size-2],[8,size-3],[8,size-4],[8,size-5],[8,size-6],[8,size-7],[8,size-8],[size-7,8],[size-6,8],[size-5,8],[size-4,8],[size-3,8],[size-2,8],[size-1,8]];
      for (var i = 0; i < 15; i++) {
        var bit = !!((formatBits >> (14 - i)) & 1);
        grid[fp1[i][0]][fp1[i][1]] = bit;
        grid[fp2[i][0]][fp2[i][1]] = bit;
      }

      return grid;
    }

    function rsEncode(data, eccCount) {
      var gfExp = new Array(512), gfLog = new Array(256), x = 1;
      for (var i = 0; i < 255; i++) { gfExp[i] = x; gfLog[x] = i; x <<= 1; if (x >= 256) x ^= 0x11D; }
      for (var i = 255; i < 512; i++) gfExp[i] = gfExp[i - 255];
      function gfMul(a, b) { return (a === 0 || b === 0) ? 0 : gfExp[gfLog[a] + gfLog[b]]; }
      var gen = [1];
      for (var i = 0; i < eccCount; i++) {
        var ng = new Array(gen.length + 1).fill(0);
        for (var j = 0; j < gen.length; j++) { ng[j] ^= gen[j]; ng[j + 1] ^= gfMul(gen[j], gfExp[i]); }
        gen = ng;
      }
      var msg = data.slice();
      for (var i = 0; i < eccCount; i++) msg.push(0);
      for (var i = 0; i < data.length; i++) {
        var coef = msg[i];
        if (coef !== 0) for (var j = 0; j < gen.length; j++) msg[i + j] ^= gfMul(gen[j], coef);
      }
      return msg.slice(data.length);
    }
  </script>
</body>
